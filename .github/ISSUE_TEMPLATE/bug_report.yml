name: Bug report
description: Something isn't working the way it should.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as
        you can — a minimal reproduction is worth ten paragraphs of description.

  - type: input
    id: version
    attributes:
      label: ClashCode version
      description: Output of `clashcode --version`
      placeholder: '0.14.0'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: 'v20.11.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Windows (WSL)
        - Windows (native)
        - Other
    validations:
      required: true

  - type: dropdown
    id: sandbox
    attributes:
      label: Sandbox backend
      options:
        - docker
        - shuru
        - local
        - auto
        - not applicable
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Paste any error messages verbatim. Consider running with `--log-level debug`.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands + inputs. Smaller is better.
      placeholder: |
        1. Run `clashcode init`
        2. Type `/team on`
        3. Send "refactor foo.ts"
        4. See error: ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant stderr output. Redact API keys and personal info.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I've run `clashcode /doctor` and attached the report if relevant
        - label: I've searched existing issues for duplicates
